<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق رواية القبعة البيضاء</title>
    <link rel="stylesheet" href="style.css">
    <link rel="maniffest" href="manifest.json">
</head>
<body>

    <div class="container">
        <!-- شاشة المواسم الرئيسية -->
        <div id="seasons-screen" class="screen active">
            <h1>رواية القبعة البيضاء</h1>
            <p class="subtitle">رواية سجاد ثامر</p>
            
            <div class="timeline-container" id="seasons-container">
                <!-- سيتم توليد الـ 8 مواسم برمجياً لتجنب التكرار والتخربط -->
            </div>
        </div>

        <!-- شاشة الحلقات -->
        <div id="episodes-screen" class="screen">
            <button class="back-btn" onclick="goBackToSeasons()">← رجوع للمواسم</button>
            <h1 id="season-title"></h1>
            <div class="episodes-list-container" id="episodes-container">
                <!-- سيتم توليد الـ 24 حلقة للموسم المختار برمجياً -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
